name: Job Automation Scheduler

on:
  schedule:
    - cron: "11 */10 * * *"
  workflow_dispatch:

jobs:
  discover-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Job Discovery
        run: npm run automation:discover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}